<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>З Днем Народження, Марто!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            flex-direction: column;
        }

        .card {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 40px;
            text-align: center;
            z-index: 10;
            max-width: 80%;
            transition: all 0.5s ease;
        }

        h1 {
            color: #d81b60;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        p {
            color: #4a148c;
            font-size: 1.2em;
            line-height: 1.6;
            display: none; /* Приховано до кліку */
        }

        button {
            background-color: #ff4081;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
            transition: transform 0.2s, background-color 0.2s;
            margin-top: 20px;
        }

        button:hover {
            background-color: #f50057;
            transform: scale(1.05);
        }

        /* Стилі для контейнера з фотографіями */
        .photo-gallery {
            display: none; /* Приховано до кліку */
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .photo-gallery img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .photo-gallery img:hover {
            transform: scale(1.1);
        }

        /* Анімації */
        .heart, .cat {
            position: absolute;
            bottom: -50px;
            opacity: 0.8;
            animation: floatUp linear forwards;
        }

        .heart {
            color: red;
            font-size: 24px;
        }

        .cat {
            font-size: 30px; /* Емодзі кота */
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card" id="greetingCard">
        <h1>Для Марти! 🎉</h1>
        <button id="surpriseBtn">Натисни сюди!</button>
        
        <p id="message">
            З Днем Народження!<br>
            Нехай кожен день буде наповнений радістю, сміхом та яскравими моментами. Бажаю здійснення всіх мрій! 🌟
        </p>

        <!-- Блок з фотографіями -->
        <div class="photo-gallery" id="gallery" style="display: none;">
            <!-- Встав свої локальні зображення нижче. 
                 Спочатку завантаж картинки в папку на GitHub і вкажи їхні назви замість img1.jpg і т.д. -->
            <img src="img1.jpg" alt="Фото 1"> 
            <img src="img2.jpg" alt="Фото 2">
            <img src="img3.jpg" alt="Фото 3">
        </div>
    </div>

    <script>
        const btn = document.getElementById('surpriseBtn');
        const message = document.getElementById('message');
        const gallery = document.getElementById('gallery');
        let animationInterval;

        btn.addEventListener('click', () => {
            btn.style.display = 'none'; // Ховаємо кнопку
            message.style.display = 'block'; // Показуємо текст
            gallery.style.display = 'flex'; // Показуємо галерею
            
            // Запускаємо генерацію елементів
            animationInterval = setInterval(createFloatingElement, 300);
            
            // Зупиняємо генерацію через 15 секунд, щоб не перевантажувати браузер
            setTimeout(() => {
                clearInterval(animationInterval);
            }, 15000);
        });

        function createFloatingElement() {
            const el = document.createElement('div');
            
            // Випадково вибираємо, чи це буде серце, чи кіт
            if (Math.random() > 0.5) {
                el.classList.add('heart');
                el.innerHTML = '❤️';
            } else {
                el.classList.add('cat');
                el.innerHTML = '🐱';
            }

            // Випадкова позиція по горизонталі
            el.style.left = Math.random() * 100 + 'vw';
            
            // Випадковий розмір
            el.style.transform = `scale(${Math.random() * 1.5 + 0.5})`;
            
            // Випадкова тривалість анімації (від 3 до 6 секунд)
            const duration = Math.random() * 3 + 3;
            el.style.animationDuration = duration + 's';

            document.body.appendChild(el);

            // Видаляємо елемент після завершення анімації
            setTimeout(() => {
                el.remove();
            }, duration * 1000);
        }
    </script>
</body>
</html>
