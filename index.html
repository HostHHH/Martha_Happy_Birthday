<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Марти</title>
<style>
body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
}
.card {
    background: rgba(255, 255, 255, 0.92);
    padding: 3rem;
    border-radius: 24px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    text-align: center;
    max-width: 420px;
    z-index: 100;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.3);
}
h1 {
    color: #d81b60;
    font-size: 2.2rem;
    margin-bottom: 1.5rem;
}
p {
    color: #444;
    font-size: 1.15rem;
    line-height: 1.7;
    display: none;
    opacity: 0;
    transition: opacity 1s ease-in;
}
button {
    background: #d81b60;
    color: white;
    border: none;
    padding: 16px 36px;
    font-size: 1.1rem;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 4px 15px rgba(216, 27, 96, 0.3);
}
button:hover {
    background: #ad1457;
    transform: scale(1.08);
    box-shadow: 0 6px 20px rgba(216, 27, 96, 0.4);
}
.float-element {
    position: absolute;
    pointer-events: none;
    z-index: 1;
}
.heart {
    color: #ff4081;
    font-size: 20px;
    animation: floatUp 4s linear forwards;
}
.cat {
    width: 90px;
    height: 90px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    animation: floatUpRotated 6s linear forwards;
}

/* --- ПОМИЛКА БУЛА ТУТ --- */
/* Я ДОДАВ Step 50% { opacity: 1; }, щоб елементи ставали видимими */

@keyframes floatUp {
    0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
    50% { opacity: 1; } /* Елемент стає видимим на середині шляху */
    100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
}
@keyframes floatUpRotated {
    0% { transform: translateY(110vh) rotate(0deg) scale(0.5); opacity: 0; }
    50% { opacity: 1; } /* Елемент стає видимим на середині шляху */
    100% { transform: translateY(-20vh) rotate(360deg) scale(1.2); opacity: 0; }
}
</style>
</head>
<body>

<div class="card" id="mainCard">
    <h1>Для Марти ✨</h1>
    <button id="actionBtn">Натисни, щоб побачити магію</button>
    <p id="greetingText">Ти неймовірна людина, яка робить світ яскравішим! Твій хлопець дуже тебе цінує, і ми всі бажаємо тобі безмежного щастя, натхнення та здійснення найзаповітніших мрій. Залишайся такою ж чудовою!</p>
</div>

<script>
const actionBtn = document.getElementById('actionBtn');
const greetingText = document.getElementById('greetingText');

const catImages = [
    'https://getshared.com/dashboard/api/files/8aa7d7ba-4964-11f1-8264-ac1f6b763f30/stream?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOjQ1NjI2LCJlbWFpbCI6Im9yZXN0bWF0c2V2eWNoQGdtYWlsLmNvbSIsImlhdCI6MTc3ODA4MzE1MCwiZXhwIjoxNzgwNjc1MTUwfQ.YPvZ3SA8_Ru0LH55guOuA6l6y2388QNlVldruCwz9v4&t=1778083170257',
    'https://getshared.com/dashboard/api/files/1b19e80e-4966-11f1-8264-ac1f6b763f30/stream?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOjQ1NjI2LCJlbWFpbCI6Im9yZXN0bWF0c2V2eWNoQGdtYWlsLmNvbSIsImlhdCI6MTc3ODA4MzE1MCwiZXhwIjoxNzgwNjc1MTUwfQ.YPvZ3SA8_Ru0LH55guOuA6l6y2388QNlVldruCwz9v4&t=1778083864811',
    'https://getshared.com/dashboard/api/files/0f58cc75-4966-11f1-8264-ac1f6b763f30/stream?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOjQ1NjI2LCJlbWFpbCI6Im9yZXN0bWF0c2V2eWNoQGdtYWlsLmNvbSIsImlhdCI6MTc3ODA4MzE1MCwiZXhwIjoxNzgwNjc1MTUwfQ.YPvZ3SA8_Ru0LH55guOuA6l6y2388QNlVldruCwz9v4&t=1778083846946',
    'https://getshared.com/dashboard/api/files/0f3f3c4a-4966-11f1-8264-ac1f6b763f30/stream?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOjQ1NjI2LCJlbWFpbCI6Im9yZXN0bWF0c2V2eWNoQGdtYWlsLmNvbSIsImlhdCI6MTc3ODA4MzE1MCwiZXhwIjoxNzgwNjc1MTUwfQ.YPvZ3SA8_Ru0LH55guOuA6l6y2388QNlVldruCwz9v4&t=1778083835622'
];

const spawnElement = (type) => {
    const el = document.createElement('div');
    el.className = `float-element ${type}`;
    
    if (type === 'heart') {
        el.innerText = '❤️';
    } else if (type === 'cat') {
        const randomImg = catImages[Math.floor(Math.random() * catImages.length)];
        el.style.backgroundImage = `url('${randomImg}')`;
    }
    
    el.style.left = `${Math.random() * 100}vw`;
    const duration = type === 'cat' ? Math.random() * 3 + 5 : Math.random() * 2 + 3;
    el.style.animationDuration = `${duration}s`;
    
    document.body.appendChild(el);
    setTimeout(() => el.remove(), duration * 1000);
};

actionBtn.addEventListener('click', () => {
    actionBtn.style.display = 'none';
    greetingText.style.display = 'block';
    setTimeout(() => {
        greetingText.style.opacity = '1';
    }, 100);

    setInterval(() => spawnElement('heart'), 400);
    setInterval(() => spawnElement('cat'), 1000);
});
</script>

</body>
</html>
